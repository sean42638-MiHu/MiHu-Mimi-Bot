<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MiHu Admin Phase 4 Fixture</title>
<link rel="stylesheet" href="/public/css/admin-components.css">
<style>
body{margin:0;background:#0b0914;color:#f3f4f6;font-family:system-ui,sans-serif}.fixture-shell{max-width:980px;margin:auto;padding:20px 36px 32px}.fixture-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.fixture-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.fixture-hidden{display:none}.modal{display:none}.modal.show{display:block}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65)}.vip-preview{display:inline-flex;margin-top:10px;padding:7px 12px;border:1px solid var(--vip-color,#a855f7);border-radius:999px;color:var(--vip-color,#a855f7)}
@media(max-width:767.98px){.fixture-shell{padding:20px 16px 32px}.fixture-grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="fixture-shell">
<header class="admin-page-header"><div class="admin-page-header__main"><span class="admin-page-header__icon"><i class="fa-solid fa-flask"></i></span><div><h1 class="admin-page-header__title">Phase 4 CRUD Fixture</h1><p class="admin-page-header__description">Roles / Staff / VIP isolated modal verification</p></div></div></header>
<div class="fixture-actions"><button class="admin-btn admin-btn-primary" data-open-modal="roleModal">Roles Create</button><button class="admin-btn admin-btn-primary" data-open-modal="staffModal">Staff Edit</button><button class="admin-btn admin-btn-primary" data-open-modal="vipModal">VIP Edit</button><button class="admin-btn admin-btn-danger" id="dangerConfirm">Delete Confirm</button></div>
<div class="fixture-grid"><section class="admin-panel"><div class="admin-panel-header"><h2 class="admin-section-title">Roles</h2><p class="admin-section-description">Required validation and submit loading</p></div><div id="roleError" class="admin-form-error-summary fixture-hidden">請修正必填欄位。</div></section><section class="admin-panel"><div class="admin-panel-header"><h2 class="admin-section-title">Staff</h2><p class="admin-section-description">PII-safe fixture</p></div><span class="admin-sensitive-indicator"><i class="fa-solid fa-lock"></i> 敏感資料不進 data-*</span></section><section class="admin-panel"><div class="admin-panel-header"><h2 class="admin-section-title">VIP</h2><p class="admin-section-description">HEX preview only</p></div><span id="fixtureVipPreview" class="vip-preview">VIP 8</span></section></div>
</main>
<div class="modal fade admin-modal" id="roleModal" tabindex="-1"><div class="modal-dialog admin-modal-dialog admin-modal-dialog--md"><div class="modal-content admin-modal-content"><form class="admin-form" id="roleForm" data-admin-submit-loading><div class="admin-modal-header"><h2 class="admin-modal-title">新增角色</h2><button type="button" class="admin-modal-close" data-close-modal aria-label="關閉">×</button></div><div class="admin-modal-body"><div class="admin-form-group"><label class="admin-form-label admin-form-label-required" for="roleName">角色名稱</label><input class="admin-form-control" id="roleName" required aria-describedby="roleNameError"><span id="roleNameError" class="admin-field-error" hidden>請輸入角色名稱。</span></div></div><div class="admin-modal-footer"><button type="button" class="admin-btn admin-btn-ghost" data-close-modal>取消</button><button class="admin-btn admin-btn-primary" type="submit">儲存</button></div></form></div></div></div>
<div class="modal fade admin-modal" id="staffModal" tabindex="-1"><div class="modal-dialog admin-modal-dialog admin-modal-dialog--md"><div class="modal-content admin-modal-content"><form class="admin-form" id="staffForm" data-admin-submit-loading><div class="admin-modal-header"><h2 class="admin-modal-title">編輯員工</h2><button type="button" class="admin-modal-close" data-close-modal aria-label="關閉">×</button></div><div class="admin-modal-body"><div class="admin-form-group"><label class="admin-form-label" for="staffName">顯示名稱</label><input class="admin-form-control" id="staffName" value="DEV Staff"></div><div class="admin-sensitive-field"><span class="admin-sensitive-indicator"><i class="fa-solid fa-lock"></i> 敏感資料</span></div></div><div class="admin-modal-footer"><button type="button" class="admin-btn admin-btn-ghost" data-close-modal>取消</button><button class="admin-btn admin-btn-primary" type="submit">儲存</button></div></form></div></div></div>
<div class="modal fade admin-modal" id="vipModal" tabindex="-1"><div class="modal-dialog admin-modal-dialog admin-modal-dialog--md"><div class="modal-content admin-modal-content"><form class="admin-form" id="vipForm" data-admin-submit-loading><div class="admin-modal-header"><h2 class="admin-modal-title">編輯 VIP</h2><button type="button" class="admin-modal-close" data-close-modal aria-label="關閉">×</button></div><div class="admin-modal-body"><div class="admin-form-group"><label class="admin-form-label admin-form-label-required" for="vipColor">HEX 色碼</label><input class="admin-form-control" id="vipColor" value="#A855F7" pattern="^#[0-9A-Fa-f]{6}$" required><span id="vipColorError" class="admin-field-error" hidden>請輸入有效 HEX 色碼。</span></div><div id="vipPreview" class="vip-preview">VIP 8</div></div><div class="admin-modal-footer"><button type="button" class="admin-btn admin-btn-ghost" data-close-modal>取消</button><button class="admin-btn admin-btn-primary" type="submit">儲存</button></div></form></div></div></div>
<div class="modal fade admin-confirm-modal" id="adminConfirmModal" tabindex="-1" aria-labelledby="adminConfirmTitle"><div class="modal-dialog"><div class="modal-content admin-confirm-modal__content"><div class="modal-header"><span class="admin-confirm-modal__icon" data-confirm-icon aria-hidden="true"><i class="fa-solid fa-circle-question"></i></span><h2 class="modal-title" id="adminConfirmTitle" data-confirm-title>確認操作</h2></div><div class="modal-body"><p data-confirm-message></p></div><div class="modal-footer"><button class="admin-btn admin-btn-ghost" data-confirm-cancel>取消</button><button class="admin-btn admin-btn-danger" data-confirm-submit>確認刪除</button></div></div></div></div>
<div class="admin-toast-region" id="mihuToastRegion" aria-live="polite"></div>
<script>window.bootstrap={Modal:class{constructor(e){this.e=e}static getOrCreateInstance(e){return new this(e)}show(){this.e.classList.add('show');this.e.dispatchEvent(new Event('shown.bs.modal'))}hide(){this.e.classList.remove('show');this.e.dispatchEvent(new Event('hidden.bs.modal'))}}};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show'))});</script>
<script src="/public/js/admin-feedback.js"></script>
<script>
let activeTrigger=null;document.querySelectorAll('[data-open-modal]').forEach(b=>b.onclick=()=>{activeTrigger=b;bootstrap.Modal.getOrCreateInstance(document.getElementById(b.dataset.openModal)).show()});document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=()=>{const m=b.closest('.modal');bootstrap.Modal.getOrCreateInstance(m).hide();activeTrigger?.focus()});document.getElementById('vipColor').oninput=e=>{const valid=/^#[0-9A-Fa-f]{6}$/.test(e.target.value);document.getElementById('vipColor').setAttribute('aria-invalid',String(!valid));document.getElementById('vipColorError').hidden=valid;document.getElementById('vipPreview').style.setProperty('--vip-color',valid?e.target.value:'#f87171')};document.getElementById('roleForm').onsubmit=e=>{if(!e.target.checkValidity()){e.preventDefault();document.getElementById('roleError').classList.remove('fixture-hidden')}};document.getElementById('dangerConfirm').onclick=()=>MiHuFeedback.confirm({title:'刪除身分',message:'此操作可能影響使用該身分的會員權限。',variant:'danger'});
</script></body></html>
