<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log Phase 8 Fixture</title><link rel="stylesheet" href="/public/css/admin-components.css"><link rel="stylesheet" href="/public/css/audit-logs.css"><style>*{box-sizing:border-box}body{margin:0;background:#0b0914;color:#f3f4f6;font-family:system-ui,sans-serif}.shell{width:100%;max-width:1000px;margin:auto;padding:20px 36px 32px}@media(max-width:767.98px){.shell{padding:20px 16px 32px}}</style></head><body><main class="shell"><header class="admin-page-header"><div class="admin-page-header__main"><span class="admin-page-header__icon">A</span><div><h1 class="admin-page-header__title">操作紀錄</h1><p class="admin-page-header__description">查看系統管理操作、設定異動與重要管理事件</p></div></div></header><section class="admin-panel audit-logs-panel"><div class="admin-panel-header"><h2 class="admin-section-title">系統操作紀錄</h2><p class="admin-section-description">唯讀稽核資料；金融 Ledger 與操作紀錄分開保存。</p></div><form class="admin-toolbar audit-logs-toolbar"><div class="admin-form-group audit-logs-search"><label class="admin-form-label" for="q">搜尋操作紀錄</label><input class="admin-form-control" id="q" placeholder="事件、操作者或目標類型"></div><div class="admin-form-group"><label class="admin-form-label" for="event">事件</label><select class="admin-form-select" id="event"><option>全部事件</option><option>PAYOUT_SETTINGS_UPDATED</option></select></div><button class="admin-btn admin-btn-primary">套用篩選</button></form><div class="admin-table-wrap audit-logs-table-wrap"><table class="admin-table audit-logs-table"><thead><tr><th>時間</th><th>事件</th><th>操作者</th><th>目標</th><th>詳細資料</th></tr></thead><tbody><tr><td>2026-09-27</td><td><span class="admin-badge admin-badge-info">提款設定更新</span><div class="audit-logs-code">PAYOUT_SETTINGS_UPDATED</div></td><td>DEV Manager</td><td>system_settings</td><td><button class="admin-btn admin-btn-ghost audit-detail-trigger" id="detailButton">查看</button></td></tr></tbody></table></div></section><div class="modal fade admin-modal" id="detail" tabindex="-1"><div class="modal-dialog admin-modal-dialog admin-modal-dialog--md"><div class="modal-content admin-modal-content"><div class="admin-modal-header"><h2 class="admin-modal-title">提款設定更新</h2><button class="admin-modal-close" id="close" aria-label="關閉">×</button></div><div class="admin-modal-body"><dl class="audit-detail-list"><div><dt>詳細資料</dt><dd>提款期間：2–6 → 3–7</dd></div><div><dt>最低金額</dt><dd>NT$100 → NT$500</dd></div></dl></div><div class="admin-modal-footer"><button class="admin-btn admin-btn-ghost" id="close2">關閉</button></div></div></div></div><script>detailButton.onclick=()=>detail.classList.add('show');close.onclick=close2.onclick=()=>detail.classList.remove('show');document.addEventListener('keydown',e=>{if(e.key==='Escape')detail.classList.remove('show')});</script></body></html>
