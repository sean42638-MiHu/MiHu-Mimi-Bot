<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Settings Phase 6 Fixture</title><link rel="stylesheet" href="/public/css/admin-components.css"><link rel="stylesheet" href="/public/css/system-settings.css"><style>body{margin:0;background:#0b0914;color:#f3f4f6;font-family:system-ui,sans-serif}.shell{max-width:960px;margin:auto;padding:20px 36px 32px}.modal{display:none}.modal.show{display:block}@media(max-width:767.98px){.shell{padding:20px 16px 32px}}</style></head><body><main class="shell"><header class="admin-page-header"><div class="admin-page-header__main"><span class="admin-page-header__icon">S</span><div><h1 class="admin-page-header__title">系統設定</h1><p class="admin-page-header__description">配置全站核心運作參數、提領開放時間、系統全域設定與驗證機制</p></div></div></header><div id="error" class="admin-form-error-summary" hidden>系統設定儲存失敗，請稍後再試。</div><section class="system-settings-panel admin-panel"><h2>薪資提款設定</h2><p>設定每月薪資提款申請期間與最低申請金額。</p><form id="settingsForm" class="admin-form" data-admin-confirm data-confirm-title="確認更新提款設定" data-confirm-message="即將套用新的提款期間與最低申請金額。" data-confirm-variant="warning" data-admin-submit-loading><div class="system-settings-day-fields"><div class="admin-form-group"><label class="admin-form-label admin-form-label-required" for="start">開始日</label><input id="start" class="admin-form-control" type="number" value="3" min="1" max="31" required></div><span>至</span><div class="admin-form-group"><label class="admin-form-label admin-form-label-required" for="end">結束日</label><input id="end" class="admin-form-control" type="number" value="7" min="1" max="31" required></div></div><div class="admin-form-group"><label class="admin-form-label admin-form-label-required" for="minimum">最低提款金額</label><input id="minimum" class="admin-form-control" type="number" value="500" min="1" step="1" required></div><div class="admin-form-actions"><button class="admin-btn admin-btn-primary" type="submit">儲存設定</button></div></form><section class="system-settings-preview"><h3>目前規則</h3><p>目前提款開放期間：每月 <strong id="previewStart">3</strong> 日 00:00 至 <strong id="previewEnd">7</strong> 日 23:59:59</p><p>最低提款金額：<strong>NT$<span id="previewMinimum">500</span></strong></p></section></section><section class="system-settings-panel admin-panel system-settings-coming-soon"><h2>其他系統模組</h2><p>尚未開放的核心功能仍會以 Coming Soon 狀態呈現。</p><span class="admin-badge admin-badge-muted">驗證機制 · Coming Soon</span><span class="admin-badge admin-badge-muted">系統參數 · Coming Soon</span></section></main><div class="modal fade admin-confirm-modal" id="confirm" tabindex="-1"><div class="modal-dialog"><div class="modal-content admin-confirm-modal__content"><div class="modal-header"><h2 class="modal-title">確認更新提款設定</h2></div><div class="modal-body"><p>即將套用新的提款期間與最低申請金額。</p></div><div class="modal-footer"><button id="cancel" class="admin-btn admin-btn-ghost">取消</button><button id="ok" class="admin-btn admin-btn-warning">確認更新</button></div></div></div></div><script>const form=document.getElementById('settingsForm'),modal=document.getElementById('confirm');['start','end','minimum'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{document.getElementById('previewStart').textContent=document.getElementById('start').value;document.getElementById('previewEnd').textContent=document.getElementById('end').value;document.getElementById('previewMinimum').textContent=Number(document.getElementById('minimum').value||0).toLocaleString()}));form.addEventListener('submit',e=>{e.preventDefault();modal.classList.add('show');document.getElementById('cancel').focus()});document.getElementById('cancel').onclick=()=>modal.classList.remove('show');document.getElementById('ok').onclick=()=>{modal.classList.remove('show');form.querySelector('button[type=submit]').disabled=true;form.querySelector('button[type=submit]').setAttribute('aria-busy','true')};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('show')});</script></body></html>
